<script>
  (function initGallery() {
    const thumbs       = Array.from(document.querySelectorAll('.gallery-thumb'));
    const modalOverlay = document.getElementById('gallery-modal-overlay');
    const modalClose   = document.getElementById('gallery-modal-close');
    const modalTitle   = document.getElementById('gallery-modal-title');
    const modalImg     = document.getElementById('gallery-modal-img');
    const prevBtn      = document.getElementById('gallery-prev');
    const nextBtn      = document.getElementById('gallery-next');

    if (!thumbs.length || !modalOverlay) return;

    let current = 0;
    let opener  = null;

    prevBtn.hidden = thumbs.length < 2;
    nextBtn.hidden = thumbs.length < 2;

    function show(index) {
      current = (index + thumbs.length) % thumbs.length;
      const thumb = thumbs[current];
      modalImg.src           = thumb.dataset.src;
      modalImg.alt           = thumb.dataset.caption;
      modalTitle.textContent = thumb.dataset.caption;
    }

    function openModal(index) {
      opener = thumbs[index];
      show(index);
      modalOverlay.hidden = false;
      modalClose.focus();
    }

    function closeModal() {
      modalOverlay.hidden = true;
      if (opener) opener.focus();
    }

    thumbs.forEach((thumb, i) => {
      thumb.addEventListener('click', () => openModal(i));
    });
    prevBtn.addEventListener('click', () => show(current - 1));
    nextBtn.addEventListener('click', () => show(current + 1));
    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (modalOverlay.hidden) return;
      if (e.key === 'Escape') closeModal();
      else if (e.key === 'ArrowLeft' && thumbs.length > 1) show(current - 1);
      else if (e.key === 'ArrowRight' && thumbs.length > 1) show(current + 1);
    });
  })();
</script>
