{% comment %}
  Back / Next pager for a tile grid on /events, in the News page's pagination style.
  The events page script fills in the page count and enables the buttons.
{% endcomment %}<div class="pagination events-pager" hidden>
  <button type="button" class="btn btn-green" data-step="-1">Back</button>
  <span class="pagination-info"></span>
  <button type="button" class="btn btn-green" data-step="1">Next</button>
</div>
